name: Hosted database ownership check
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-keller-cxp9ac]
    paths: ['tests/hosted/**', '.github/workflows/hosted-db-check.yml']
jobs:
  ownership:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Two-session ownership, save, edit and rollback test
        env:
          SUPABASE_URL: https://rdrkskrzdyqezzopnena.supabase.co
          # Public browser key (safe to commit); never put a service-role key here.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_fSu0PKPg6Y4T4JICz-Cczg_CEn5jP30
        run: node tests/hosted/ownership.mjs
