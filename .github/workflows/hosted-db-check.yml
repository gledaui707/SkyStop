name: Hosted database checks (manual only)
# Manual runs only. No push/schedule triggers: these tests create synthetic guests/plans in the hosted project.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "journey = happy-path app data layer; ownership = advanced two-session test (conflict path known to hang)"
        type: choice
        options: [journey, ownership]
        default: journey
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://sgwbtgwccskqamzttczz.supabase.co
      # Public browser key (safe to commit); never put a service-role key here.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_9ChZ7Mk52ignva4mWoL6Yw_Bj4RL14D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Happy-path journey through the real data layer
        if: inputs.suite == 'journey'
        run: npm ci && npm run test:hosted
      - name: Advanced two-session ownership test
        if: inputs.suite == 'ownership'
        run: node tests/hosted/ownership.mjs
